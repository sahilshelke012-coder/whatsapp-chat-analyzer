<div class="charts-dashboard">
  
  <div class="chart-panel glass-card full-width">
    <div class="chart-header">
      <h4>📈 Messages Timeline (By Date)</h4>
      <span class="sub-text">Daily chat activity volume over time</span>
    </div>
    <div class="chart-container">
      <canvas #dateChartCanvas></canvas>
    </div>
  </div>

  <div class="chart-panel glass-card">
    <div class="chart-header">
      <h4>📊 Messages by Month</h4>
      <span class="sub-text">Monthly trends</span>
    </div>
    <div class="chart-container">
      <canvas #monthChartCanvas></canvas>
    </div>
  </div>

  <div class="chart-panel glass-card">
    <div class="chart-header">
      <h4>🍩 Messages by Participant</h4>
      <span class="sub-text">Contribution share</span>
    </div>
    <div class="chart-container">
      <canvas #userChartCanvas></canvas>
    </div>
  </div>

  <div class="chart-panel glass-card">
    <div class="chart-header">
      <h4>⏰ Hourly Activity Distribution (0-23h)</h4>
      <span class="sub-text">Peak messaging hours</span>
    </div>
    <div class="chart-container">
      <canvas #hourChartCanvas></canvas>
    </div>
  </div>

  <div class="chart-panel glass-card">
    <div class="chart-header">
      <h4>📅 Messages by Day of Week</h4>
      <span class="sub-text">Monday through Sunday activity</span>
    </div>
    <div class="chart-container">
      <canvas #dayOfWeekChartCanvas></canvas>
    </div>
  </div>

</div>
